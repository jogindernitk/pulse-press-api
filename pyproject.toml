[project]
name = "pulse-press-api"
version = "0.1.0"
description = "Backend REST API for PulsePress, a multi-author publishing platform."
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "setuptools<81",
    "uvicorn>=0.18.2,<0.19.0",
    "fastapi>=0.79.1,<0.80.0",
    "pydantic[email,dotenv]>=1.9,<2.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "pyjwt>=2.4,<3.0",
    "databases>=0.6.1,<0.7.0",
    "asyncpg>=0.26.0,<0.27.0",
    "psycopg2-binary>=2.9.3,<3.0.0",
    "aiosql>=6.2,<7.0",
    "pypika>=0.48.9,<0.49.0",
    "alembic>=1.8,<2.0",
    "python-slugify>=6.1,<7.0",
    "Unidecode>=1.3,<2.0",
    "loguru>=0.6.0,<0.7.0",
]

[dependency-groups]
dev = [
    "black>=22.6.0,<23.0.0",
    "isort>=5.10,<6.0",
    "autoflake>=1.4,<2.0",
    "wemake-python-styleguide>=0.16.1,<0.17.0",
    "mypy>=0.971,<0.980",
    "flake8-fixme>=1.1,<2.0",
    "pytest>=7.1,<8.0",
    "pytest-cov>=3.0,<4.0",
    "pytest-asyncio>=0.19.0,<0.20.0",
    "pytest-env>=0.6.2,<0.7.0",
    "pytest-xdist>=3.0,<4.0",
    "httpx>=0.23.0,<0.24.0",
    "asgi-lifespan>=1.0.1,<2.0.0",
]

[tool.isort]
profile = "black"
src_paths = ["app", "tests"]
combine_as_imports = true

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = [
  "error",
  "ignore::pytest.PytestDeprecationWarning",
  "ignore::DeprecationWarning",
  "ignore:pkg_resources is deprecated:UserWarning",
  "ignore::jwt.warnings.InsecureKeyLengthWarning",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=app
  --cov=tests
  --cov-branch
  --cov-report=term-missing
  --cov-report=html
  --cov-report=xml
  --no-cov-on-fail
  --cov-fail-under=99
  --numprocesses=auto
  --asyncio-mode=auto
'''
env = [
  "SECRET_KEY=test-secret-key-at-least-32-bytes-long",
  "MAX_CONNECTIONS_COUNT=1",
  "MIN_CONNECTIONS_COUNT=1"
]
